<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Engine-Oil Cover Cap | CRAFTED COMPOSITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #ffffff; --text-color: #1a1a1a; --border-color: #eeeeee; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--bg-color); color: var(--text-color); line-height: 1.8; }

        nav { 
            width: 100%; height: 80px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 5%; background: rgba(255, 255, 255, 0.95); position: fixed; top: 0; z-index: 1000; 
            border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px);
        }
        
        .brand-logo { display: flex; align-items: center; text-decoration: none; }
        .brand-logo img { height: 38px; width: auto; display: block; mix-blend-mode: multiply; }

        .nav-links { display: flex; align-items: center; gap: 40px; }
        .nav-links a { text-decoration: none; color: var(--text-color); font-size: 0.75rem; font-weight: 500; letter-spacing: 2px; display: inline-flex; align-items: center; }

        .dropdown { position: relative; display: flex; align-items: center; }
        .dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0; background-color: #ffffff;
            min-width: 280px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1); border: 1px solid var(--border-color);
            z-index: 1001; padding: 4px 0;
        }
        .dropdown-menu a {
            font-family: 'BankGothic Md BT', sans-serif; color: var(--text-color); padding: 6px 20px;
            text-decoration: none; display: block; font-size: 0.95rem; letter-spacing: 1px; white-space: nowrap; transition: 0.2s;
        }
        .dropdown-menu a:hover { background-color: #f8f8f8; color: #000; }
        .dropdown:hover .dropdown-menu { display: block; }

        .universal-hero { 
            margin-top: 80px; height: 38vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('bg-carbon.jpg'); 
            background-size: cover; background-position: center; color: #fff;
        }
        .universal-hero h1 { 
            font-size: clamp(1.6rem, 3.5vw, 2.3rem); font-weight: 300; letter-spacing: 7px; text-transform: uppercase; margin: 0; 
        }
        .universal-hero p { 
            font-size: 0.75rem; font-weight: 300; letter-spacing: 4px; color: rgba(255, 255, 255, 0.8); text-transform: uppercase; margin-top: 8px; 
        }

        .main-content { max-width: 1200px; margin: 0 auto; padding: 60px 5% 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
        
        .product-visual { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .main-image-container { background-color: #fcfcfc; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; border: 1px solid #f0f0f0; cursor: zoom-in; overflow: hidden; }
        .main-image-container img { max-width: 85%; max-height: 85%; width: auto; height: auto; object-fit: contain; transition: transform 0.3s; }
        
        /* 💡 修正：改為 5 欄 Grid 網格，9 張圖自動分成兩行，完美鎖定在左欄寬度內 💡 */
        .thumbnail-bar { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            width: 100%;
        }
        .thumbnail-bar img { 
            width: 100%; 
            height: 60px; 
            object-fit: cover; 
            border: 1px solid #eee; 
            cursor: pointer; 
            opacity: 0.6; 
            transition: 0.3s; 
        }
        .thumbnail-bar img.active { opacity: 1; border-color: #000; }

        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255,255,255,0.98); align-items: center; justify-content: center; }
        .modal-content { max-width: 90%; max-height: 80%; object-fit: contain; }
        .close-modal { position: absolute; top: 30px; right: 50px; font-size: 40px; cursor: pointer; color: #000; }

        .product-info { width: 100%; }
        .product-title { font-size: 1.65rem; font-weight: 600; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; white-space: nowrap; letter-spacing: 1px; }
        .product-info p { color: #666; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.8; }
        .comp-link-text { display: inline-block; margin-top: 5px; margin-bottom: 30px; font-size: 0.95rem; color: #000; font-weight: 700; text-decoration: none; border-bottom: 2px solid #000; transition: all 0.3s; letter-spacing: 1px; }
        .price { font-size: 1.8rem; font-weight: 700; margin-bottom: 25px; }
        .btn-black { display: block; width: 100%; padding: 18px; background: #000; color: #fff; text-decoration: none; text-align: center; font-weight: 600; letter-spacing: 4px; }

        footer { padding: 80px 50px; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.65rem; color: #ccc; letter-spacing: 3px; }
        
        @media (max-width: 900px) { 
            .main-content { grid-template-columns: 1fr; } 
            .product-title { font-size: 1.4rem; white-space: normal; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="brand-logo">
        <img src="logo.png" alt="CRAFTED COMPOSITE">
    </a>
    <div class="nav-links">
        <div class="dropdown">
            <a href="index.html">COLLECTION</a>
            <div class="dropdown-menu">
                <a href="bmw-oil-cap.html">BMW Engine-Oil Cover Cap</a>
                <a href="bmw-paddle-shifter.html">Paddle Shifter for BMW G</a>
                <a href="audi-b10-paddle-shifter.html">Paddle Shifter for Audi B10</a>
                <a href="benz-paddle-shifter.html">Paddle Shifter for Benz</a>
            </div>
        </div>
        <a href="craft.html">CRAFT</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<section class="universal-hero">
    <h1>Composite Refinement</h1>
    <p>Crafted Composite Collection</p>
</section>

<main class="main-content">
    <div class="product-visual">
        <div class="main-image-container" onclick="openModal()">
            <!-- 主圖預設顯示海報封面 -->
            <img id="currentDisplay" src="CraftedComposite_Forged_Carbon_EngineoilCap_CoverPhoto.JPG" alt="BMW Forged Carbon Oil Cap">
        </div>
        <div class="thumbnail-bar">
            <!-- 第一行 5 張 -->
            <img src="CraftedComposite_Forged_Carbon_EngineoilCap_CoverPhoto.JPG" class="active" onclick="switchImage(this.src, this)">
            <img src="CraftedComposite_Forged_Carbon_EngineoilCap_Triple.jpg" onclick="switchImage(this.src, this)">
            <img src="CraftedComposite_Forged_Carbon_EngineoilCap_EngineBay.jpg" onclick="switchImage(this.src, this)">
            <img src="image_87b1c8.jpg" onclick="switchImage(this.src, this)">
            <img src="image_87b1c9.jpg" onclick="switchImage(this.src, this)">
            
            <!-- 第二行 4 張 -->
            <img src="image_87b1c10.jpg" onclick="switchImage(this.src, this)">
            <img src="image_87b1c11.jpg" onclick="switchImage(this.src, this)">
            <img src="image_87b1c12.jpg" onclick="switchImage(this.src, this)">
            <img src="image_87b1c13.jpg" onclick="switchImage(this.src, this)">
        </div>
    </div>

    <div class="product-info">
        <h2 class="product-title">BMW 碳纖維機油蓋</h2>
        <p>
            採用航太級 3K 預浸碳纖維布，採用鍛造熱壓成型。專為 BMW G 系列引擎室量身打造，展現極致工藝。
        </p>
        
        <a href="compatibility.html" class="comp-link-text">查看完整適用車種清單 →</a>

        <div class="price">TWD 1280</div>
        <a href="contact.html" class="btn-black">立即預訂</a>
    </div>
</main>

<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

<footer>© 2026 CRAFTED COMPOSITE.</footer>

<script>
    function switchImage(src, thumb) {
        document.getElementById('currentDisplay').src = src;
        const thumbs = document.querySelectorAll('.thumbnail-bar img');
        thumbs.forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
    }
    function openModal() {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const currentImg = document.getElementById('currentDisplay');
        modal.style.display = "flex";
        modalImg.src = currentImg.src;
    }
    function closeModal() {
        document.getElementById('imageModal').style.display = "none";
    }
</script>

</body>
</html>
